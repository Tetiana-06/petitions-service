
# Опис сервісів web і db, volume, мережі, healthcheck

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    # Lab 6: 3 однакові репліки; порт назовні не публікується — вхід лише через nginx
    deploy:
      replicas: 3
    restart: on-failure  # повторний старт, якщо репліки одночасно ініціалізують порожню БД
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Lab 6: балансувальник навантаження — єдина точка входу
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${LB_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:

networks:
  backend:

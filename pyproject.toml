# Контроль якості коду — Ruff

# Секція глобальних налаштувань лінтера та форматувальника Ruff
[tool.ruff]

# Максимальна довжина одного рядка коду (88 символів — золотий стандарт PEP 8 та стилю Black)
line-length = 150

# Версія Python, під синтаксичні особливості та можливості якої орієнтується аналізатор
target-version = "py312"


# Секція правил лінтингу (пошуку помилок, багів та порушень стандарту коду)
[tool.ruff.lint]

# Список активних категорій перевірок:
#   "E" (Errors)   — стилістичні помилки за стандартом PEP 8 (зайві пробіли, відступи тощо)
#   "F" (Pyflakes) — логічні помилки та баги (невикористані змінні/імпорти, невизначені імена)
#   "I" (isort)    — правила сортування та групування блоків імпортів
#   "W" (Warnings) — попередження PEP 8 щодо оформлення коду
select = ["E", "F", "I", "W"]

# Список кодів помилок, які лінтер має ігнорувати (порожній список означає, що перевіряється все)
ignore = []


# Секція автоматичного форматування коду (налаштування відступів і лапок)
[tool.ruff.format]

# Використовувати подвійні лапки ("...") для рядкових літералів замість одинарних
quote-style = "double"

# Робити відступи пробілами, а не символами табуляції (\t)
indent-style = "space"
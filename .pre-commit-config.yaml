# Pre-commit хуки

# Список зовнішніх репозиторіїв з інструментами, які Git запускатиме перед комітом

repos:
    # Офіційне посилання на репозиторій розробників Ruff, звідки pre-commit стягує хук
  - repo: https://github.com/astral-sh/ruff-pre-commit

    # Версія інструмента Ruff, яку завантажить pre-commit (тег релізу на GitHub)
    rev: v0.3.4

    # Перелік конкретних дій (хуків), які мають виконуватися
    hooks:
        # Перший хук: пошук помилок, невикористаних імпортів та порушень PEP 8
      - id: ruff
        # Аргумент --fix автоматично виправляє прості помилки (наприклад, видаляє зайві пробіли)
        args: [--fix]

        # Другий хук: автоматичне форматування коду (вирівнює відступи, лапки, переноси)
      - id: ruff-format
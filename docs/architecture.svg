<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Архітектура сервісу місцевих електронних петицій</title>
<desc>Шестирівнева схема: Telegram-канал, користувачі, Nginx-балансувальник, два stateless-інстанси FastAPI, Redis та черга задач, база даних PostgreSQL з UNIQUE-обмеженням.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="610" fill="#FFFFFF"/>

<rect x="210" y="30" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Telegram-канал</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">публікація посилання</text>
<line x1="340" y1="86" x2="340" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="116" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Користувачі та мобільні клієнти</text>
<text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">HTTP / HTTPS</text>
<line x1="340" y1="172" x2="340" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="202" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Nginx</text>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">балансувальник · TLS · rate limit</text>
<path d="M340 258 V280 H220 V296" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 258 V280 H460 V296" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="110" y="302" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="220" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">FastAPI інстанс 1</text>
<text x="220" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">stateless API</text>

<rect x="350" y="302" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="460" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">FastAPI інстанс 2</text>
<text x="460" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">stateless API</text>

<line x1="220" y1="358" x2="220" y2="394" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="358" x2="460" y2="394" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="110" y="400" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Redis</text>
<text x="220" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">кеш перегляду · rate limit</text>

<rect x="350" y="400" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="460" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Черга задач</text>
<text x="460" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">асинхронна валідація КЕП</text>

<path d="M220 456 V478 H340 V492" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M460 456 V478 H340 V492" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="170" y="498" width="340" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="520" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">PostgreSQL</text>
<text x="340" y="542" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">petitions, votes · UNIQUE-обмеження</text>

<text x="340" y="588" text-anchor="middle" font-size="12" fill="#5F5E5A">Сірий — клієнти · фіолетовий — рівень застосунку · бірюзовий — рівень даних</text>
</svg>

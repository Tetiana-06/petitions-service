<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" font-family="'Plus Jakarta Sans', Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="640" fill="#F8FAFC" rx="16"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Архітектура безпеки та контролю доступу (Лабораторна робота №2)</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#64748B">Сервіс місцевих електронних петицій: JWT, RBAC та IDOR-захист</text>

  <!-- Level 1: Clients & Roles -->
  <g transform="translate(40, 85)">
    <rect width="720" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">КЛІЄНТИ ТА РОЛІ КОРИСТУВАЧІВ</text>

    <!-- Client 1 -->
    <rect x="25" y="35" width="205" height="42" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="127" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">👤 Anonymous / Гість</text>
    <text x="127" y="68" text-anchor="middle" font-size="10" fill="#64748B">Публічний перегляд (401 на захищене)</text>

    <!-- Client 2 -->
    <rect x="257" y="35" width="205" height="42" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="359" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#065F46">👤 Citizen (Role: USER)</text>
    <text x="359" y="68" text-anchor="middle" font-size="10" fill="#047857">Створення, підпис, свій кабінет</text>

    <!-- Client 3 -->
    <rect x="490" y="35" width="205" height="42" rx="8" fill="#F3E8FF" stroke="#DDD6FE"/>
    <text x="592" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#581C87">🛡️ Administrator (ADMIN)</text>
    <text x="592" y="68" text-anchor="middle" font-size="10" fill="#7C3AED">Адмін-панель, модерація статусів</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="175" x2="400" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 2: Web & Security Gateway -->
  <g transform="translate(40, 215)">
    <rect width="720" height="135" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#1D4ED8" letter-spacing="1">РІВЕНЬ БЕЗПЕКИ FASTAPI (SECURITY & RBAC GATEWAY)</text>

    <!-- Component 1 -->
    <rect x="25" y="40" width="215" height="75" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="132" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">🔐 JWT Автентифікація</text>
    <text x="132" y="80" text-anchor="middle" font-size="11" fill="#3B82F6">OAuth2PasswordBearer</text>
    <text x="132" y="98" text-anchor="middle" font-size="10" fill="#64748B">Перевірка підпису токена HS256</text>

    <!-- Component 2 -->
    <rect x="252" y="40" width="215" height="75" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="359" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">🛡️ RBAC Контроль (403)</text>
    <text x="359" y="80" text-anchor="middle" font-size="11" fill="#3B82F6">require_admin dependency</text>
    <text x="359" y="98" text-anchor="middle" font-size="10" fill="#64748B">Вертикальне розмежування ролей</text>

    <!-- Component 3 -->
    <rect x="480" y="40" width="215" height="75" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="587" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">🔒 IDOR Захист (403)</text>
    <text x="587" y="80" text-anchor="middle" font-size="11" fill="#3B82F6">Перевірка прав власності</text>
    <text x="587" y="98" text-anchor="middle" font-size="10" fill="#64748B">author_id == current_user.id</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="350" x2="400" y2="385" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 3: Business Logic Endpoints -->
  <g transform="translate(40, 390)">
    <rect width="720" height="95" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">МАРШРУТИ БІЗНЕС-ЛОГІКИ (ENDPOINTS)</text>

    <rect x="25" y="38" width="160" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="105" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">/auth/login, register</text>
    <text x="105" y="70" text-anchor="middle" font-size="10" fill="#64748B">Bcrypt hash &amp; JWT</text>

    <rect x="195" y="38" width="160" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="275" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">/users/me, {id}</text>
    <text x="275" y="70" text-anchor="middle" font-size="10" fill="#64748B">Кабінет + IDOR захист</text>

    <rect x="365" y="38" width="160" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="445" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">/admin/dashboard, stats</text>
    <text x="445" y="70" text-anchor="middle" font-size="10" fill="#64748B">Тільки ADMIN (RBAC)</text>

    <rect x="535" y="38" width="160" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="615" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">/petitions/ (CRUD, vote)</text>
    <text x="615" y="70" text-anchor="middle" font-size="10" fill="#64748B">MVP логіка петицій</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="485" x2="400" y2="515" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 4: Database Layer -->
  <g transform="translate(40, 520)">
    <rect width="720" height="85" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">РІВЕНЬ ДАНИХ (SQLALCHEMY 2.0 ASYNC + SQLITE / POSTGRESQL)</text>

    <rect x="25" y="34" width="215" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="132" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Таблиця users</text>
    <text x="132" y="65" text-anchor="middle" font-size="9" fill="#64748B">id, username, hashed_password, role, full_name</text>

    <rect x="252" y="34" width="215" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="359" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Таблиця petitions</text>
    <text x="359" y="65" text-anchor="middle" font-size="9" fill="#64748B">id, title, description, status, author_id (FK)</text>

    <rect x="480" y="34" width="215" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="587" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Таблиця votes</text>
    <text x="587" y="65" text-anchor="middle" font-size="9" fill="#64748B">id, petition_id (FK), user_id (FK), UNIQUE</text>
  </g>

</svg>

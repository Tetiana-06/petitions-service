# Lab 6: Nginx як зворотний проксі та балансувальник навантаження

upstream backend {
    # Алгоритм за замовчуванням — Round Robin.
    # Додаткове завдання: розкоментувати рядок нижче (ip_hash) і виконати `docker compose restart nginx`.
    # ip_hash;

    # Ім'я сервісу "web" Docker DNS резолвить в IP усіх реплік — nginx додає кожну як окремий сервер.
    # Пасивний health check: після 1 невдалої спроби сервер виключається з ротації на 15 с.
    server web:8000 max_fails=1 fail_timeout=15s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Швидко визнаємо репліку мертвою і повторюємо запит на наступній
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;

        # Яка репліка (IP:порт) обробила запит — видно в заголовку відповіді
        add_header X-Upstream $upstream_addr always;
    }
}
